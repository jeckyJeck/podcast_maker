# Fixed cases used by run_all_test_cases. Owned by the agent (not backend data).
# `format` is the backend pipeline id (GET /prompts-test-api/pipelines); `inputs` are that
# pipeline's declared inputs (see its YAML). Only cases matching the workspace's pipeline run.
cases:
  - id: sql_history
    format: duo_long
    inputs: {topic: "The invention of SQL"}
    tags: [historical, technical]

  - id: gps_explainer
    format: solo_short
    inputs: {topic: "How GPS works"}
    tags: [technical, scientific]

  - id: french_revolution
    format: duo_long
    inputs: {topic: "The French Revolution"}
    tags: [historical, narrative]
