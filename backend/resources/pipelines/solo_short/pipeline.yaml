      \ outline, verify:\n\n- [ ] **Scene count**: 3-5 scenes MAXIMUM\n- [ ] **Total\
      \ word count**: Under 800 words across all scenes\n- [ ] **Single host**: No\
      \ dialogue beats, no HOST_2 references\n- [ ] **One case study**: Only one,\
