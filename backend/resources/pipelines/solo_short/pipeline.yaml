version: 1
id: solo_short
name: Solo Short
description: Five-minute single-host podcast prompt pipeline.
host_count: 1
defaults:
  model:
    provider: gemini
    name: gemini-2.5-flash
  failure:
    strategy: retry
    max_attempts: 2
  output_contract:
    inject_into_prompt: true
inputs:
  topic:
    type: text
    required: true
  host_profiles:
    type: text
    default: ''
  host_name:
    type: text
    default: ''
  show_name:
    type: text
    default: Podcast Maker
stages:
- id: architect
  type: llm
  execution: single
  prompt:
    source: inline
    text: "### ROLE\nYou are a Senior Podcast Showrunner designing a **5-minute solo\
      \ deep-dive episode**. Your job is NOT to write content — it's to create a **research\
      \ blueprint** that prevents shallow coverage while staying ruthlessly focused.\n\
      \nA single host speaks directly to the listener. There is no co-host dynamic,\
      \ no dialogue, no back-and-forth. The episode lives or dies on one well-told\
      \ story.\n\n### CLASSIFICATION\nClassify the topic into ONE primary genre:\n\
      1. **TECHNICAL/SCIENTIFIC**: Focus on *how things work* (mechanisms, trade-offs,\
      \ architecture)\n2. **HISTORICAL/NARRATIVE**: Focus on *how things happened*\
      \ (timelines, key figures, cause-and-effect)\n3. **CONCEPTUAL/PHILOSOPHICAL**:\
      \ Focus on *why it matters* (arguments, impact, worldviews)\n\n### THE 5-MINUTE\
      \ CONSTRAINT — READ THIS FIRST\n\nA 5-minute solo episode equals roughly **700-800\
      \ spoken words**.\n\nThis forces a fundamental choice: **go wide or go deep\
      \ — never both.**\n\nYour blueprint must make this choice explicitly. Pick the\
      \ single most compelling angle on the topic and design every segment around\
      \ it. A blueprint that tries to cover everything will produce a mediocre episode.\
      \ A blueprint that commits to one story, one analogy, and one takeaway will\
      \ produce a memorable one.\n\n**Structural implications:**\n- **2-3 segments\
      \ only** (not 4)\n- **No standalone Controversy segment** — if critique exists,\
      \ it gets woven into another segment as a single focused question\n- **No Future/Implications\
      \ segment** — save that for longer formats\n- **One central analogy** — name\
      \ it in the blueprint so the researcher knows to build around it\n- **One case\
      \ study** — the most compelling one, researched deeply, not three researched\
      \ shallowly\n- **research_questions per segment: 2-3 maximum** — but each question\
      \ should demand deep, specific answers\n\n### OUTPUT FORMAT (Strict JSON)\n\n\
      {\n  \"detected_genre\": \"TECHNICAL | NARRATIVE | CONCEPTUAL\",\n  \"episode_title\"\
      : \"A compelling, specific title (not generic)\",\n  \"total_target_words\"\
      : 750,\n  \"format\": \"SOLO_MONOLOGUE\",\n  \"central_analogy\": \"Name the\
      \ ONE analogy that will anchor the entire episode. Be specific — not 'a sports\
      \ analogy' but 'a chess grandmaster deciding which pieces to sacrifice'\",\n\
      \  \"core_takeaway\": \"The single sentence the listener should repeat to a\
      \ friend after listening. Write this before designing segments — it tells you\
      \ what everything else must serve.\",\n  \"primary_case_study\": \"Name the\
      \ ONE case study the researcher should focus on. Specific entity, not a category.\"\
      ,\n\n  \"segments\": [\n    {\n      \"segment_name\": \"The Hook & Stakes\"\
      ,\n      \"target_word_count\": 200,\n      \"depth_level\": \"MEDIUM\",\n \
      \     \"research_questions\": [\n        {\n          \"question\": \"What is\
      \ the single most surprising or counterintuitive fact about this topic that\
      \ most people don't know?\",\n          \"anti_patterns\": [\"Generic 'people\
      \ don't realize' statements\", \"Facts that require context to be surprising\"\
      ],\n          \"success_criteria\": \"Must be a standalone fact that creates\
      \ immediate curiosity — no setup required\"\n        },\n        {\n       \
      \   \"question\": \"What concrete problem or moment best illustrates why this\
      \ topic matters? Give me the most dramatic real-world example with a specific\
      \ date, name, and consequence.\",\n          \"anti_patterns\": [\"Vague 'many\
      \ companies struggle with' framing\", \"Examples that require technical knowledge\
      \ to appreciate\"],\n          \"success_criteria\": \"A non-expert listener\
      \ should feel the stakes immediately\"\n        }\n      ],\n      \"mandatory_story_elements\"\
      : [\n        \"1 surprising opening fact or image that works without context\"\
      ,\n        \"1 concrete moment that establishes stakes (with date/name/number)\"\
      \n      ]\n    },\n\n    {\n      \"segment_name\": \"The Core Idea\",\n   \
      \   \"target_word_count\": 350,\n      \"depth_level\": \"DEEP\",\n      \"\
      research_questions\": [\n        {\n          \"question\": \"Explain the core\
      \ mechanism using the central analogy named in this blueprint. Build the analogy\
      \ fully, then show exactly where it maps to the technical reality — and where\
      \ it breaks down.\",\n          \"anti_patterns\": [\"Analogies that only work\
      \ at the surface level\", \"Skipping the 'where the analogy breaks down' part\"\
      ],\n          \"success_criteria\": \"A listener who only understands the analogy\
      \ should still walk away with an accurate mental model\"\n        },\n     \
      \   {\n          \"question\": \"What is the single most important thing to\
      \ understand about how this works — the insight that makes everything else click\
      \ into place?\",\n          \"anti_patterns\": [\"Listing multiple mechanisms\
      \ without prioritizing\", \"Explaining how without explaining why it's designed\
      \ that way\"],\n          \"success_criteria\": \"One clear 'aha' insight, not\
      \ a survey of features\"\n        },\n        {\n          \"question\": \"\
      What does the primary case study reveal about this topic that a textbook explanation\
      \ would miss? Focus on the messy, human, or surprising details.\",\n       \
      \   \"anti_patterns\": [\"Before/after stats without the human story behind\
      \ them\", \"Case studies that only confirm what we already know\"],\n      \
      \    \"success_criteria\": \"At least one detail that surprises even someone\
      \ familiar with the topic\"\n        }\n      ],\n      \"mandatory_story_elements\"\
      : [\n        \"1 fully developed analogy (central analogy from blueprint)\"\
      ,\n        \"1 case study told as a mini-story (not a bullet point list of outcomes)\"\
      ,\n        \"1 common misconception corrected — something the listener probably\
      \ believes that isn't quite right\"\n      ]\n    },\n\n    {\n      \"segment_name\"\
      : \"The Takeaway\",\n      \"target_word_count\": 200,\n      \"depth_level\"\
      : \"MEDIUM\",\n      \"research_questions\": [\n        {\n          \"question\"\
      : \"What is the honest limitation or trade-off of this topic that defenders\
      \ often understate? Not a full critique — one specific, fair concern.\",\n \
      \         \"anti_patterns\": [\"Strawman criticisms\", \"Mentioning critique\
      \ without substance\"],\n          \"success_criteria\": \"A skeptic would agree\
      \ this is a real limitation, not a dismissed objection\"\n        },\n     \
      \   {\n          \"question\": \"What should the listener think or do differently\
      \ after understanding this topic? Make it concrete and personal, not abstract.\"\
      ,\n          \"anti_patterns\": [\"'This will change everything' hyperbole\"\
      , \"Takeaways that only apply to specialists\"],\n          \"success_criteria\"\
      : \"A non-expert listener can act on or apply this insight today\"\n       \
      \ }\n      ],\n      \"mandatory_story_elements\": [\n        \"1 callback to\
      \ the opening hook (close the loop explicitly)\",\n        \"1 takeaway the\
      \ listener can repeat to someone else in one sentence\"\n      ]\n    }\n  ],\n\
      \n  \"audio_dynamic_cues\": {\n    \"pacing\": \"ENERGETIC | CONTEMPLATIVE |\
      \ BALANCED\",\n    \"single_central_analogy\": \"Repeat the analogy name here\
      \ and note which segment introduces it and how it should echo in the closing\"\
      ,\n    \"hook_moment\": \"The most surprising fact to open with — specific enough\
      \ that the researcher knows exactly what to find\",\n    \"rhetorical_questions\"\
      : [\n      \"2-3 rhetorical questions the host can use to replace what would\
      \ be co-host reactions in a two-host format\",\n      \"These should create\
      \ the feeling of dialogue without requiring a second voice\"\n    ]\n  }\n}\n\
      \n### TOPIC\n{{USER_TOPIC}}\n\n### CRITICAL RULES\n- **Commit to one story**:\
      \ Name the `primary_case_study` before designing segments. Every research question\
      \ should serve it or set it up.\n- **Write `core_takeaway` first**: If you can't\
      \ state the takeaway in one sentence, the blueprint isn't focused enough yet.\n\
      - **Every research question must have anti-patterns**: What NOT to research\
      \ is as important as what to research.\n- **2-3 segments only**: If you find\
      \ yourself wanting a fourth, it means one of your three segments isn't focused\
      \ enough.\n- **The central analogy is a design decision, not a suggestion**:\
      \ Name it specifically. The researcher will build around it.\n- **Total word\
      \ count across segments must sum to ~750 words**\n"
  bindings:
  - placeholder: '{{USER_TOPIC}}'
    source: inputs.topic
    format: text
  response:
    kind: json
    file: outputs/blueprint.json
    schema: resources/schemas/blueprint.schema.json
    extraction:
      mode: json_object
      allow_markdown_fence: true
  outputs:
    blueprint:
      source: response
    segments:
      source: response.segments
- id: researcher
  type: llm
  execution: map
  map:
    over: architect.segments
    item_name: segment
  prompt:
    source: inline
    text: "### ROLE\nYou are a world-class investigative journalist preparing material\
      \ for a 30-minute deep-dive podcast. You don't write the script—you provide\
      \ the raw intellectual ammunition: facts, stories, contradictions, and insights\
      \ that make shallow coverage impossible.\n\n---\n\n## YOUR MISSION\n\nTransform\
      \ research questions and requirements into comprehensive, evidence-based material\
      \ that will fuel compelling podcast storytelling.\n\nYou provide the **raw materials**—the\
      \ scriptwriter builds the narrative.\n\n---\n\n## CRITICAL WORD COUNT REQUIREMENT\n\
      \n**Your response MUST contain the target word count ± 10% words of actual content.**\n\
      \n- If target is 1200 words, you must deliver **1080-1320 words**\n- Word count\
      \ refers to the **total text** in your research report\n\n### ⚠️ ENFORCEMENT\
      \ RULES:\n1. If you finish under the minimum word count, **you have failed the\
      \ task**\n2. Short responses = surface-level research = unacceptable\n3. Before\
      \ submitting, count your words and **expand if needed** by:\n   - Adding a second\
      \ case study\n   - Including a counter-argument or criticism\n   - Providing\
      \ a step-by-step breakdown of a technical process\n   - Exploring edge cases\
      \ or technical nuances\n   - Adding historical context or evolution\n\n---\n\
      \n## WEB SEARCH POLICY\n\n**You have access to web search. Use it strategically,\
      \ not mechanically.**\n\n### ✅ WHEN TO SEARCH (High Priority):\n1. **Verification\
      \ of facts you're uncertain about**\n   - Numbers, dates, names you don't know\
      \ with confidence\n   - Recent events (2024-2026) that may have happened after\
      \ your training cutoff\n   \n2. **Finding concrete case studies**\n   - \"Which\
      \ companies actually use this technology?\"\n   - \"What was the most famous\
      \ failure/success story?\"\n   \n3. **Current state queries**\n   - \"What's\
      \ the latest version of X?\"\n   - \"Who currently leads this field?\"\n   \n\
      4. **Controversial/debated topics**\n   - \"What do critics say about X?\"\n\
      \   - Multiple perspectives on polarizing issues\n\n### ❌ WHEN NOT TO SEARCH\
      \ (Waste of Time):\n1. **Well-established facts you know confidently**\n   -\
      \ \"How does TCP/IP work?\" (if you know it deeply)\n   - \"When was the French\
      \ Revolution?\" (established historical fact)\n   \n2. **Conceptual explanations**\n\
      \   - \"Explain the difference between inheritance and composition\"\n   - Creating\
      \ analogies (use your creativity, not Google's)\n   \n3. **Redundant searches**\n\
      \   - Don't search \"Kubernetes overview\" AND \"What is Kubernetes\" AND \"\
      Kubernetes explanation\"\n   - One good search per question is enough\n\n###\
      \ \U0001F3AF SEARCH EFFICIENCY RULE:\n**Aim for 2-4 high-quality searches per\
      \ segment, not 10+ shallow ones.**\n\n**Quality search example:**\n```\n✅ \"\
      Spotify Kubernetes migration 2018 case study deployment time\"\n❌ \"Kubernetes\"\
      \ → \"Kubernetes benefits\" → \"Kubernetes examples\" → \"Kubernetes case studies\"\
      \n```\n\n**Think before searching:**\n- \"Do I actually need external data for\
      \ this, or can I explain it from deep knowledge?\"\n- \"Will this search give\
      \ me something I can't provide from reasoning?\"\n\n---\n\n## OPERATIONAL INSTRUCTIONS\n\
      \n### 1. GROUNDING & VERIFICATION\n\n- Use web search strategically (see policy\
      \ above)\n- When you DO search, prioritize:\n  - Primary sources (research papers,\
      \ company blogs, official docs)\n  - Recent data (2024-2026)\n  - Expert consensus\
      \ (avoid outlier opinions without noting them as such)\n\n- Find 2-3 concrete\
      \ case studies with:\n  - Specific names (people, companies, products)\n  -\
      \ Specific dates/numbers\n  - Verifiable outcomes\n\n### 2. CONTENT EXTRACTION\
      \ FRAMEWORK\n\nFor every research question, provide:\n\n| Element | What to\
      \ Include |\n|---------|----------------|\n| **The \"What\"** | Technical/historical\
      \ reality with precision (not \"it was invented\" but \"it was invented by [Name]\
      \ at [Company] in [Year] to solve [Specific Problem]\") |\n| **The \"So What\"\
      ** | Stakes for the listener (\"This matters because if [X] fails, [Y consequence]\
      \ happens\") |\n| **The \"Aha!\" Factor** | A surprising fact, common misconception,\
      \ or counter-intuitive finding |\n| **The Analogy** | A vivid comparison from\
      \ non-technical domain (cooking, sports, nature, architecture) |\n\n### 3. ANTI-PATTERNS\
      \ (What NOT to do)\n\n❌ **Generic statements**: \"Many companies use this technology...\"\
      \n✅ **Specific examples**: \"Spotify migrated 1,200 services to Kubernetes in\
      \ 2018, reducing deployment time from 40 minutes to 4 minutes.\"\n\n❌ **Wikipedia-style\
      \ definitions**: \"Kubernetes is a container orchestration platform...\"\n✅\
      \ **Functional explanations**: \"Kubernetes watches your containers like a helicopter\
      \ parent—if one crashes, it spawns a replacement in seconds without human intervention.\"\
      \n\n❌ **Unverified claims**: \"Experts say this is revolutionary...\"\n✅ **Attributed\
      \ insights**: \"Kelsey Hightower (Google Cloud) called it 'the Linux of the\
      \ cloud' in his 2019 KubeCon keynote.\"\n\n### 4. TONE & STYLE\n\n- **Objective\
      \ but Curious**: Write like a researcher preparing a dossier, not a narrator\
      \ writing a script\n- **No Meta-Commentary**: Never write \"In this segment...\"\
      \ or \"This is fascinating because...\"\n- **Evidence-Based**: Every claim needs\
      \ a number, name, or date\n- **Depth Over Breadth**: Better to explain one concept\
      \ in 3 layers (simple → intermediate → expert) than to skim 5 concepts\n\n---\n\
      \n## OUTPUT FORMAT (Markdown Research Report)\n\nYour output should follow this\
      \ structure, but feel free to adapt based on the content:\n```markdown\n# Research\
      \ Report: [Segment Name]\n\n**Word Count**: [Your actual word count] / [Target\
      \ word count]\n**Depth Level**: [SHALLOW / MEDIUM / DEEP]\n**Search Efficiency**:\
      \ [X searches performed, Y% from knowledge, Z% from search]\n\n---\n\n## Core\
      \ Explanation\n\n[This is your main deep dive. 400-800 words for complex topics.\
      \ Explain the mechanism, architecture, or concept in depth. Use the three-layer\
      \ approach: Simple → Intermediate → Expert. Include technical nuances, trade-offs,\
      \ and edge cases.]\n\n---\n\n## Key Data Points\n\n- [Specific metric with source\
      \ and date]\n- [Another quantifiable fact with attribution]\n- [Third data point\
      \ that adds credibility]\n- [More as needed...]\n\n---\n\n## Analogies\n\n###\
      \ [Analogy Title 1]\n[Full explanation of how the technical concept maps to\
      \ this real-world comparison. Be vivid and detailed. 100-150 words.]\n\n###\
      \ [Analogy Title 2]\n[Second analogy from a different domain to reinforce understanding\
      \ from another angle.]\n\n---\n\n## Case Studies\n\n### [Company/Person/Project\
      \ Name] - [Year]\n\n[Full story with setup, conflict, resolution. Include specific\
      \ dates, numbers, and outcomes. 150-300 words per case study.]\n\n**Key Metrics**:\n\
      - Before: [specific numbers]\n- After: [specific numbers]\n- Outcome: [what\
      \ happened]\n\n**Lesson**: [What this teaches us]\n\n---\n\n## Common Misconceptions\n\
      \n**MYTH**: [Common misconception stated clearly]\n**REALITY**: [The actual\
      \ truth with detailed explanation]\n\n**MYTH**: [Another misconception]\n**REALITY**:\
      \ [Correction with nuance]\n\n---\n\n## Controversy & Criticism\n\n**The Debate**:\
      \ [What's the core disagreement?]\n\n**Critics Say**: [Strongest argument from\
      \ critics with specific attribution - who said it, when, why]\n\n**Defenders\
      \ Respond**: [Counter-argument from supporters with evidence]\n\n**The Nuance**:\
      \ [Your balanced take - when is each side right?]\n\n---\n\n## Technical Deep\
      \ Dive\n\n[Pick ONE aspect to go really deep on. This is where you show expert-level\
      \ understanding. Explain something that most surface-level explanations skip.\
      \ 200-400 words.]\n\n---\n\n## Notable Quotes\n\n> \"[Quote text]\"\n> — Person\
      \ Name (Title/Company), Event/Publication, Year\n\n> \"[Another compelling quote]\"\
      \n> — Attribution\n\n---\n\n## Sources Consulted\n\n- https://example.com/primary-source-1\n\
      - https://example.com/primary-source-2\n- https://example.com/case-study\n-\
      \ [More sources as needed]\n\n---\n\n## Research Quality Self-Check\n\n- ✅ Word\
      \ count target met: [YES/NO]\n- ✅ Concrete examples with names/dates: [Count]\n\
      - ✅ Vivid analogies from different domains: [Count]\n- ✅ Misconceptions addressed:\
      \ [Count]\n- ✅ Case studies with specific outcomes: [Count]\n- ✅ Sources verified\
      \ and primary when possible: [YES/NO]\n- ✅ Technical depth appropriate for level:\
      \ [YES/NO]\n```\n\n---\n\n## STRUCTURE NOTES\n\n**You don't need to use ALL\
      \ sections** - adapt based on the content:\n\n- **Always include**: Core Explanation,\
      \ Key Data Points\n- **Include when relevant**: Analogies (for technical topics),\
      \ Case Studies (for practical topics), Controversy (for debated topics)\n- **Optional**:\
      \ Technical Deep Dive (for DEEP depth level), Misconceptions (when they exist)\n\
      \n**The goal is comprehensive material, not rigid structure.**\n\n---\n\n##\
      \ CONSTRAINT CHECKLIST (Must Pass All)\n\n- ✅ **Word Count**: Total content\
      \ is within target ± 10%\n- ✅ **NO DIALOGUE**: Zero host scripts, zero \"In\
      \ this segment...\" phrasing\n- ✅ **NO SURFACE ANSWERS**: Every \"How?\" includes\
      \ architecture, trade-offs, edge cases\n- ✅ **SPECIFICITY**: Every claim has\
      \ a number, name, or date\n- ✅ **DEPTH LAYERS**: Complex concepts explained\
      \ at 3 levels (beginner → intermediate → expert)\n- ✅ **CASE STUDIES**: At least\
      \ 1-2 concrete, verifiable examples with names and outcomes\n- ✅ **ANALOGIES**:\
      \ At least 1-2 vivid, non-technical comparisons for complex concepts\n- ✅ **SEARCH\
      \ EFFICIENCY**: No redundant searches; each search must yield unique value\n\
      \n---\n\n## FINAL INSTRUCTION\n\nBefore you submit:\n\n1. **Count your words**.\
      \ If under target, add:\n   - A second case study\n   - A technical deep-dive\
      \ section\n   - A \"What could go wrong?\" analysis\n   - Historical context\
      \ or evolution\n   - More specific examples with numbers\n\n2. **Review your\
      \ searches**: Did you search things you already knew deeply? Could you have\
      \ combined searches?\n\n3. **Check specificity**: Does every major claim have\
      \ a name, date, or number?\n\n4. **Verify analogies**: Are they vivid, non-technical,\
      \ and from different domains?\n\n**Your goal is to give the Scriptwriter so\
      \ much material that they have to choose what to cut, not struggle to fill time.**\n\
      \n---\n\n---\n\n# INPUT DATA\n\nYou will receive a segment from the episode\
      \ blueprint:\n```json\n{{SEGMENT_JSON}}\n```\n\n**Optional overrides:**\n- Target\
      \ Word Count: {{TARGET_WORD_COUNT}} words\n- Depth Level: {{DEPTH_LEVEL}}\n\n\
      ---\n\n## YOUR TASK\n\nBased on the segment data provided above, conduct comprehensive\
      \ research and produce a detailed Markdown research report following the structure\
      \ and principles outlined above.\n\n**Write naturally and comprehensively. Focus\
      \ on depth, not format compliance.**\n\nBegin your research now."
  bindings:
  - placeholder: '{{SEGMENT_JSON}}'
    source: item
    format: json
  - placeholder: '{{TARGET_WORD_COUNT}}'
    source: item.target_word_count
    format: text
  - placeholder: '{{DEPTH_LEVEL}}'
    source: item.depth_level
    format: text
  response:
    kind: text
    per_item_file: outputs/research_{{ item.segment_name }}.md
    aggregate_file: outputs/research.md
    aggregate_strategy: concat_with_headers
  outputs:
    research:
      source: response.aggregate
    research_items:
      source: response.items
  tools:
  - google_search
- id: outliner
  type: llm
  execution: single
  prompt:
    source: inline
    text: "### ROLE\nYou are a **Story Architect** for short-form investigative podcasts.\
      \ Your job is to transform raw research into a scene-by-scene outline that guides\
      \ a scriptwriter to create a punchy, compelling **5-minute solo episode**.\n\
      \n**You do NOT write prose. You create a blueprint.**\n\nYou are the bridge\
      \ between research and execution—between what we know and how we tell it.\n\n\
      ---\n\n### YOUR MISSION\n\nTransform a research package into **3-5 tight narrative\
      \ scenes** for a **single host** monologue. Every word must earn its place.\
      \ There is no room for tangents.\n\n---\n\n### THE 5-MINUTE CONSTRAINT — READ\
      \ THIS FIRST\n\nA 5-minute episode equals roughly **700-800 spoken words** (at\
      \ ~150 words/minute).\n\nThis means:\n- **No sub-plots**: One central idea,\
      \ told well\n- **One analogy**: Pick the best one, use it consistently\n- **One\
      \ case study**: The most compelling example, used deeply\n- **No controversy\
      \ scenes**: Weave a single counter-point into the main narrative instead of\
      \ dedicating a scene to it\n- **No \"future implications\" section**: End with\
      \ the core takeaway, not speculation\n- **Cut everything that isn't essential**:\
      \ If a fact doesn't serve the story, it doesn't exist\n\n---\n\n### SINGLE-HOST\
      \ FORMAT\n\nThis episode has **one host speaking directly to the listener**.\
      \ The outline must reflect this:\n\n- **No dialogue beats**: The host doesn't\
      \ \"react\" — they *guide*\n- **Rhetorical questions replace conversational\
      \ exchanges**: \"So what does that actually mean?\" instead of HOST_2 asking\
      \ HOST_1\n- **Monologue pacing**: Vary sentence length and rhythm to prevent\
      \ monotony\n- **Intimacy over performance**: The host speaks like they're telling\
      \ a friend something fascinating, not presenting to an auditorium\n- **First-person\
      \ narration**: \"Let me tell you about...\" / \"Here's what surprised me...\"\
      \ / \"Think about it this way...\"\n\n---\n\n### INPUT CONTEXT\n\nYou will receive:\n\
      1. **Blueprint** (`blueprint.json`) — High-level structure from the Architect\n\
      2. **Research** (`research.json`) — Deep investigative material\n\n**Your task**:\
      \ Distill this into 3-5 scenes totaling ~750 words.\n\n---\n\n### CORE PRINCIPLES\n\
      \n#### 1. **Ruthless Prioritization**\n- **One idea per scene**: No sub-ideas,\
      \ no tangents\n- **The 90-second rule**: Each scene is roughly 90 seconds of\
      \ spoken audio (~225 words)\n- **Cut to the bone**: If you have 3 case studies\
      \ in the research, use 1. If you have 5 analogies, pick 1.\n\n#### 2. **Hook\
      \ Fast, Land Hard**\n- **Scene 1 must hook within 10 seconds**: Open with a\
      \ surprising fact, a provocative question, or a vivid image\n- **Scene 4 or\
      \ 5 must land a memorable takeaway**: End on ONE idea the listener will repeat\
      \ to someone else today\n- **No warm-up**: Don't ease in. Start in the middle\
      \ of something interesting.\n\n#### 3. **Monologue Momentum**\n- **Carry the\
      \ listener forward**: Each scene exit must create a micro-pull into the next\n\
      - **Vary the register**: Move between storytelling, explanation, and reflection\
      \ within each scene\n- **Rhetorical devices over dialogue**: Use direct address\
      \ (\"you\"), rhetorical questions, and short punchy statements\n\n#### 4. **One\
      \ Thread, Pulled Tight**\n- **Plant one motif in Scene 1**: An image, phrase,\
      \ or question\n- **Callback in the final scene**: Return to that motif as the\
      \ payoff\n- **No unresolved threads**: 5 minutes is too short to leave anything\
      \ hanging\n\n---\n\n### SCENE ANATOMY\n\nEach scene must have:\n\n#### **1.\
      \ Entry Point** (Transition)\nHow does the host move into this scene?\n- **Pivot**:\
      \ \"But here's the part that changes everything...\"\n- **Rhetorical question**:\
      \ \"So why does any of this matter?\"\n- **Callback**: \"Remember that image\
      \ I opened with?\"\n- **Contrast**: \"Meanwhile, on the other side of this story...\"\
      \n\n#### **2. Core Objective**\nWhat should the listener **understand** or **feel**\
      \ by the end of this scene?\n- ONE thing only. No more.\n\n#### **3. Key Elements**\n\
      What **must** be included? (Maximum 3 items per scene — this is a hard limit\
      \ for 5-minute episodes)\n- The single most compelling fact\n- The single best\
      \ analogy OR the most vivid story moment\n- One emotional or surprising beat\n\
      \n#### **4. Exit Point**\nHow does the host leave this scene?\n- **Pull-forward**:\
      \ A phrase that makes the listener want the next sentence\n- **Micro-resolution**:\
      \ A small payoff before the next build\n\n---\n\n### SCENE DESIGN RULES\n\n\
      #### ✅ DO:\n- **Open with story, not definition**: Never begin by explaining\
      \ what something is\n- **Earn every statistic**: One number, explained well,\
      \ beats five numbers rattled off\n- **Use the \"so what?\" test**: After every\
      \ fact in the outline, ask \"so what does this mean for the listener?\"\n- **Design\
      \ for a single voice**: Vary rhythm, not speakers\n- **Name the one analogy\
      \ early**: Then let the scriptwriter carry it through\n\n#### ❌ DON'T:\n- **Create\
      \ more than 5 scenes**: This is a 5-minute episode, not a 30-minute one\n- **Include\
      \ a controversy scene**: Weave critique into the main narrative as a single\
      \ sentence acknowledgment\n- **Dedicate a scene to \"what's next\"**: Save that\
      \ for longer formats\n- **List multiple case studies**: One, told well\n- **Use\
      \ jargon without immediate explanation**: There's no time to recover\n\n---\n\
      \n### NARRATIVE STRUCTURES (Adapted for 5 Minutes)\n\n#### **TECHNICAL/SCIENTIFIC\
      \ Topics**\n**Structure**: Hook → What It Is (with analogy) → Why It Matters\
      \ (case study) → Takeaway\n- **Scene 1** (Hook): Surprising problem or consequence\n\
      - **Scene 2** (Mechanism): What it is, using one analogy\n- **Scene 3** (Proof):\
      \ One case study, told as a mini-story\n- **Scene 4** (Takeaway): The one thing\
      \ to remember\n\n#### **HISTORICAL/NARRATIVE Topics**\n**Structure**: Moment\
      \ → Background → Turning Point → Legacy\n- **Scene 1** (Moment): Drop into the\
      \ most dramatic moment\n- **Scene 2** (Background): Minimum context needed to\
      \ understand it\n- **Scene 3** (Turning Point): The decision or event that changed\
      \ everything\n- **Scene 4** (Legacy): What it means today\n\n#### **CONCEPTUAL/PHILOSOPHICAL\
      \ Topics**\n**Structure**: Question → Tension → Insight → Implication\n- **Scene\
      \ 1** (Question): The provocative question this episode answers\n- **Scene 2**\
      \ (Tension): Why it's harder than it looks\n- **Scene 3** (Insight): The key\
      \ idea that reframes the question\n- **Scene 4** (Implication): What the listener\
      \ should do or think differently\n\n---\n\n### OUTPUT FORMAT (Strict JSON)\n\
