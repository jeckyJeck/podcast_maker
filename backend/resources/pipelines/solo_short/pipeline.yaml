      \ — you're designing for 5 minutes, not 30.\n\n---\n\n### ANTI-PATTERNS (What\
      \ NOT to Do)\n\n❌ **The Mini 30-Minute Outline**\n- 8 scenes compressed into\
      \ \"shorter\" versions\n- Problem: 5 minutes requires structural rethinking,\
      \ not just compression\n\n✅ **The Ruthless Distillation**\n- Pick ONE story,\
