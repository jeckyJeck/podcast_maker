  bindings:
  - placeholder: '{{HOSTS_PROFILES}}'
    source: architect.host_profiles
    format: json
  - placeholder: '{{HOST_NAME}}'
    source: inputs.host_name
    format: text
  - placeholder: '{{SHOW_NAME}}'
    source: inputs.show_name
    format: text
  - placeholder: '{{OUTLINE_JSON}}'
    source: outliner.outline
    format: json
  - placeholder: '{{RESEARCH_TEXT}}'
    source: researcher.research
    format: text
  - placeholder: '{{PREVIOUS_SCENES}}'
    source: context.previous_scenes
    format: text
  response:
    kind: text
    per_item_file: outputs/scene_{{ item.scene_number }}.txt
    aggregate_file: outputs/script.txt
    aggregate_strategy: concat
  outputs:
    script:
      source: response.aggregate
    script_scenes:
      source: response.items
